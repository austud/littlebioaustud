<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>визитка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --g0: #0b0b0b; --g1: #141414; --g2: #1f1f1f; --g3: #333; --g4: #5c5c5c;
    --g5: #9a9a9a; --g6: #cfcfcf; --g7: #ececec; --g8: #ffffff;
    --font: "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--g1); overflow-x: clip; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; overflow-x: clip; max-width: 100vw;
    font-family: var(--font); font-weight: 900; color: var(--g8); text-transform: lowercase;
    background: radial-gradient(ellipse at 50% 0%, #2a2a2a, var(--g1) 60%, var(--g0));
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }

  .spot {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(circle 340px at var(--mx, 50%) var(--my, 30%), rgba(255,255,255,.17), transparent 70%);
  }
  .floor {
    position: fixed; left: -60%; right: -60%; bottom: -8vh; height: 62vh; z-index: 0; pointer-events: none;
    transform: perspective(380px) rotateX(63deg); transform-origin: 50% 100%;
    background-image:
      linear-gradient(rgba(255,255,255,.28) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,.28) 2px, transparent 2px);
    background-size: 64px 64px;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%);
            mask-image: linear-gradient(to top, #000 10%, transparent 92%);
    animation: grid 1.6s linear infinite;
  }
  @keyframes grid { to { background-position: 0 64px; } }

  .grain {
    position: fixed; inset: 0; z-index: 70; pointer-events: none; opacity: .5; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .cubes { position: fixed; inset: 0; z-index: 1; pointer-events: none; perspective: 700px; overflow: hidden; }
  .bob { position: absolute; animation: bobcube var(--bt, 7s) ease-in-out infinite; }
  @keyframes bobcube { 50% { transform: translateY(-26px); } }
  .cube { position: relative; width: var(--s); height: var(--s); transform-style: preserve-3d; animation: cspin var(--t, 14s) linear infinite; }
  .cube i { position: absolute; inset: 0; border: 2px solid var(--g7); }
  .cube i:nth-child(1) { transform: translateZ(calc(var(--s) / 2)); background: rgba(255,255,255,.10); }
  .cube i:nth-child(2) { transform: rotateY(90deg)  translateZ(calc(var(--s) / 2)); background: rgba(255,255,255,.28); }
  .cube i:nth-child(3) { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); background: rgba(0,0,0,.35); }
  .cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); background: rgba(255,255,255,.18); }
  .cube i:nth-child(5) { transform: rotateX(90deg)  translateZ(calc(var(--s) / 2)); background: rgba(255,255,255,.4); }
  .cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); background: rgba(0,0,0,.5); }
  @keyframes cspin { to { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); } }


  .ticker { position: relative; z-index: 30; overflow: hidden; white-space: nowrap; font-size: 14px; letter-spacing: .16em; text-transform: lowercase; padding: 10px 0; }
  .ticker.top { background: var(--g7); color: var(--g1); }
  .ticker.bot { background: var(--g1); color: var(--g7); border-top: 2px solid var(--g7); }
  .track { display: inline-block; animation: marq 28s linear infinite; will-change: transform; }
  @keyframes marq { to { transform: translateX(-50%); } }

  .main { position: relative; z-index: 3; flex: 1; display: flex; justify-content: center; padding: 64px 20px 30px; overflow-x: clip; }
  .wrap { width: 100%; max-width: 440px; }
  .main.shake { animation: shake .35s linear; }
  @keyframes shake { 20% { transform: translate(-6px, 3px) rotate(-.4deg); } 40% { transform: translate(6px, -3px) rotate(.4deg); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -2px); } }


  .wait .item, .wait .pop, .wait .hero-in { animation-play-state: paused !important; }
  .item { animation: flip .9s cubic-bezier(.2, 1.3, .35, 1) backwards; }
  @keyframes flip { from { opacity: 0; transform: perspective(700px) translateY(70px) rotateX(-95deg) scale(.8); } }


  .hero { text-align: center; margin-bottom: 44px; }
  .stage { perspective: 900px; width: min(310px, 78vw); margin: 0 auto 38px; }
  .pop {
    --px: 0; --py: 0;
    position: relative; width: 100%; aspect-ratio: 1 / 1; transform-style: preserve-3d;
    transform: rotateX(calc(var(--py) * -11deg)) rotateY(calc(var(--px) * 15deg));
    animation: popin 1.2s cubic-bezier(.2, 1.4, .3, 1) .15s backwards;
    cursor: pointer;
  }
  @keyframes popin { from { opacity: 0; transform: rotateY(-110deg) rotateX(30deg) scale(.3); } }

  .frame {
    position: absolute; inset: 0; border-radius: 30px; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #7a7a7a, #232323 70%);
    border: 4px solid var(--g8);
    box-shadow: 0 0 0 2px #000, 0 40px 70px rgba(0,0,0,.65), 14px 14px 0 #000, 14px 14px 0 2px var(--g5);
  }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .rays {
    position: absolute; left: 50%; top: 64%; width: 230%; aspect-ratio: 1; margin: -115% 0 0 -115%;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.16) 0 6deg, transparent 6deg 14deg);
    animation: rot 22s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(#000 1.3px, transparent 1.8px); background-size: 9px 9px; opacity: .4; mix-blend-mode: multiply; }
  .rows { position: absolute; inset: -20%; display: flex; flex-direction: column; justify-content: space-around; transform: rotate(-9deg); }
  .rw { white-space: nowrap; font-size: 84px; line-height: 1; color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.55); }
  .rw span { display: inline-block; animation: marq 12s linear infinite; }
  .rw:nth-child(even) { -webkit-text-stroke-color: rgba(255,255,255,.22); }
  .rw:nth-child(even) span { animation-direction: reverse; animation-duration: 16s; }

  .clip {
    position: absolute; left: 0; right: 0; bottom: 0; top: -40%; overflow: hidden;
    border-radius: 0 0 30px 30px; transform: translateZ(70px); pointer-events: none;
  }
  .pwrap {
    position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    transform: translate(calc(var(--px) * 12px), calc(var(--py) * 7px));
    animation: glitch 6.5s infinite;
  }
  .person {
    position: absolute; left: 50%; bottom: 0; width: 138%; max-width: none; transform: translateX(-50%); transform-origin: 50% 100%;
    filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 14px 12px rgba(0,0,0,.6));
    animation: breathe 4s ease-in-out infinite;
  }
  .person.jump { animation: jump .8s cubic-bezier(.2, 1.6, .4, 1); }
  .letter-fallback { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font-size: 150px; line-height: 1; color: var(--g8); text-shadow: 6px 6px 0 #000; }
  @keyframes breathe { 50% { transform: translateX(-50%) scale(1.025) translateY(-3px); } }
  @keyframes jump {
    0% { transform: translateX(-50%) scale(1); }
    30% { transform: translateX(-50%) translateY(-34px) scale(1.14) rotate(-4deg); }
    60% { transform: translateX(-50%) translateY(4px) scale(.97) rotate(2deg); }
    100% { transform: translateX(-50%) scale(1); }
  }
  @keyframes glitch {
    0%, 91%, 100% { transform: translate(calc(var(--px) * 12px), calc(var(--py) * 7px)); filter: none; }
    92% { transform: translate(calc(var(--px) * 12px - 9px), calc(var(--py) * 7px)) skewX(8deg); filter: invert(1); }
    94% { transform: translate(calc(var(--px) * 12px + 8px), calc(var(--py) * 7px)) skewX(-6deg); filter: none; }
    96% { transform: translate(calc(var(--px) * 12px - 4px), calc(var(--py) * 7px - 3px)); filter: contrast(2.5); }
  }


  .shard { position: absolute; background: var(--g8); animation: floaty var(--ft, 5s) ease-in-out infinite, spin var(--st, 9s) linear infinite; }
  .shard.star { clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .shard.tri  { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .shard.ring { background: none; border: 4px solid var(--g8); border-radius: 50%; }
  .shard.sq   { border: 4px solid var(--g8); background: rgba(255,255,255,.12); }
  @keyframes floaty { 50% { margin-top: -22px; } }
  @keyframes spin { to { rotate: 360deg; } }
  .badge { position: absolute; right: -34px; bottom: -30px; width: 104px; height: 104px; transform: translateZ(110px); animation: rot 9s linear infinite; }
  .badge text { font-family: var(--font); font-size: 12px; fill: var(--g1); }


  h1 { font-size: clamp(46px, 15vw, 70px); line-height: 1; letter-spacing: -.01em; margin-bottom: 26px; perspective: 600px; }
  h1 .l { display: inline-block; animation: drop .9s cubic-bezier(.2, 1.8, .4, 1) backwards; animation-delay: calc(var(--i) * .07s + .25s); }
  h1 .in {
    display: inline-block; color: var(--g8);
    text-shadow:
      1px 1px 0 #d4d4d4, 2px 2px 0 #bdbdbd, 3px 3px 0 #a6a6a6, 4px 4px 0 #8f8f8f, 5px 5px 0 #787878,
      6px 6px 0 #636363, 7px 7px 0 #4f4f4f, 8px 8px 0 #3d3d3d, 9px 9px 0 #2c2c2c, 10px 10px 0 #1c1c1c,
      16px 24px 26px rgba(0,0,0,.7);
    animation: wave 2.8s ease-in-out infinite; animation-delay: calc(var(--i) * .16s);
    transition: transform .25s cubic-bezier(.3, 1.8, .5, 1);
  }
  h1 .l:hover .in { animation: none; transform: translateY(-20px) rotate(-12deg) scale(1.25); }
  @keyframes wave { 0%, 100% { transform: translateY(0) rotateX(0) rotate(0); } 30% { transform: translateY(-12px) rotateX(28deg) rotate(-3deg); } 65% { transform: translateY(3px) rotateX(-14deg) rotate(3deg); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-140px) rotateX(-120deg) scale(.4); } }
  .wait h1 .l { animation-play-state: paused; }

  .bio {
    display: inline-block; max-width: 340px; padding: 14px 20px; border-radius: 18px;
    background: var(--g7); color: var(--g1); font-size: 16px; line-height: 1.35; font-weight: 800; text-align: center;
    box-shadow: 0 1px 0 #aaa, 0 2px 0 #999, 0 3px 0 #888, 0 4px 0 #777, 0 5px 0 #666, 0 6px 0 #555, 0 18px 26px rgba(0,0,0,.55);
    transform: rotate(-1.4deg);
  }


  .key {
    --e: #8c8c8c; --e2: #3a3a3a;
    display: flex; align-items: center; gap: 14px; color: var(--g1); text-decoration: none;
    background: linear-gradient(180deg, #fff, #dcdcdc);
    border-radius: 20px; padding: 14px 16px;
    box-shadow: 0 1px 0 var(--e), 0 2px 0 var(--e), 0 3px 0 var(--e), 0 4px 0 var(--e), 0 5px 0 var(--e2), 0 6px 0 var(--e2), 0 7px 0 var(--e2), 0 8px 0 var(--e2), 0 20px 24px rgba(0,0,0,.6);
    transition: transform .16s cubic-bezier(.3, 1.6, .5, 1), box-shadow .16s;
    transform-style: preserve-3d; will-change: transform;
  }
  .key.dark { --e: #3d3d3d; --e2: #050505; color: var(--g8); background: linear-gradient(180deg, #3b3b3b, #1d1d1d); outline: 2px solid #777; outline-offset: -2px; }
  .key:active { transform: translateY(7px) !important; box-shadow: 0 1px 0 var(--e2), 0 2px 0 var(--e2), 0 8px 12px rgba(0,0,0,.6); }
  .primary { justify-content: center; font-size: 21px; text-transform: lowercase; letter-spacing: .02em; padding: 20px 16px; margin-bottom: 44px; border-radius: 24px; animation: flip .9s cubic-bezier(.2, 1.3, .35, 1) backwards; }
  .primary.pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.035) rotate(-.7deg); } }
  .primary svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  .group { margin-bottom: 38px; }
  .gt {
    display: inline-block; margin: 0 0 20px 4px; padding: 7px 16px; border-radius: 999px;
    background: var(--g1); color: var(--g7); border: 2px solid var(--g7); font-size: 14px; letter-spacing: .12em; text-transform: lowercase;
    box-shadow: 0 4px 0 var(--g4); transform: rotate(-2.5deg);
  }
  .cards { display: flex; flex-direction: column; gap: 26px; }
  .float { animation: bobrow 4s ease-in-out infinite; animation-delay: var(--fd, 0s); }
  @keyframes bobrow { 50% { transform: translateY(-5px); } }
  .ico { width: 46px; height: 46px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: var(--g1); color: var(--g8); transform: translateZ(26px); }
  .key.dark .ico { background: var(--g7); color: var(--g1); }
  .ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .txt { flex: 1; min-width: 0; transform: translateZ(18px); }
  .t { font-size: 19px; text-transform: lowercase; letter-spacing: -.01em; line-height: 1.1; }
  .s { margin-top: 3px; font-size: 13px; font-weight: 800; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .go { width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; border: 3px solid currentColor; font-size: 16px; transition: transform .25s; transform: translateZ(26px); }
  .key:hover .go { transform: translateZ(26px) rotate(45deg) scale(1.15); }
  .key.nolink { cursor: default; opacity: .9; }
  .key.nolink .t { font-size: 16px; }
  .key.nolink:active { transform: none !important; box-shadow: 0 1px 0 var(--e), 0 2px 0 var(--e), 0 3px 0 var(--e), 0 4px 0 var(--e), 0 5px 0 var(--e2), 0 6px 0 var(--e2), 0 7px 0 var(--e2), 0 8px 0 var(--e2), 0 20px 24px rgba(0,0,0,.6); }

  footer { text-align: center; font-size: 13px; text-transform: lowercase; letter-spacing: .1em; margin: 6px 0 10px; color: var(--g6); }


  .bit { position: fixed; z-index: 200; pointer-events: none; font-size: 22px; line-height: 1; }
  .ring { position: fixed; z-index: 190; width: 20px; height: 20px; margin: -10px 0 0 -10px; border: 3px solid #fff; border-radius: 50%; pointer-events: none; animation: ring .75s ease-out forwards; }
  @keyframes ring { to { transform: scale(22); opacity: 0; border-width: 1px; } }


  .splash {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; text-align: center; padding: 20px; cursor: pointer; overflow: hidden;
    background: var(--g0); clip-path: circle(150% at 50% 50%); transition: clip-path .95s cubic-bezier(.7, 0, .2, 1);
  }
  .splash.out { clip-path: circle(0% at 50% 50%); }
  .sp-rings { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .sp-rings i { position: absolute; width: 60vmin; height: 60vmin; margin: -30vmin 0 0 -30vmin; border: 2px solid rgba(255,255,255,.55); border-radius: 50%; animation: sring 3s ease-out infinite; animation-delay: calc(var(--k) * .6s); opacity: 0; }
  @keyframes sring { 0% { transform: scale(.1); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
  .sp-word { position: relative; white-space: nowrap; font-size: clamp(44px, 15vw, 120px); line-height: 1.05; text-transform: lowercase; letter-spacing: -.02em; perspective: 700px; }
  .sp-word .l { display: inline-block; color: var(--g8); text-shadow: 1px 1px 0 #ccc, 2px 2px 0 #aaa, 3px 3px 0 #888, 4px 4px 0 #666, 5px 5px 0 #444, 6px 6px 0 #222, 12px 18px 22px #000; animation: sdrop .9s cubic-bezier(.2, 1.6, .4, 1) backwards; animation-delay: calc(var(--i) * .09s + .1s); }
  @keyframes sdrop { from { opacity: 0; transform: translateZ(-600px) rotateX(-140deg) translateY(-100px); } }
  .sp-sub { position: relative; margin-top: 20px; color: var(--g6); font-size: 19px; font-weight: 800; animation: flip .9s cubic-bezier(.2,1.3,.35,1) .8s backwards; }
  .sp-hint { position: fixed; left: 0; right: 0; bottom: calc(32px + env(safe-area-inset-bottom)); color: var(--g5); font-size: 13px; letter-spacing: .2em; text-transform: lowercase; animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="floor"></div>
<div class="spot" id="spot"></div>
<div class="cubes" id="cubes"></div>
<div class="grain"></div>
<div class="ticker top" id="tickTop"></div>
<div class="main" id="main"><div class="wrap" id="app"></div></div>
<div class="ticker bot" id="tickBot"></div>

<script>
/* ============================================================
   ВСЁ, ЧТО НУЖНО МЕНЯТЬ, НАХОДИТСЯ ВОТ ЗДЕСЬ
   ============================================================ */
const PROFILE = {
  name: "austud",

function ring(x, y) {
  if (reduce) return;
  const r = el("span", "ring");
  r.style.left = x + "px"; r.style.top = y + "px";
  document.body.appendChild(r);
  r.addEventListener("animationend", () => r.remove());
}
function shake() {
  if (reduce) return;
  main.classList.remove("shake"); void main.offsetWidth; main.classList.add("shake");
}
function burst(x, y, n) {
  if (reduce) return;
  const G = ["◆", "▲", "■", "✦", "●", "✚", "★"], T = ["#fff", "#ddd", "#aaa", "#777", "#444"];
  for (let i = 0; i < (n || 16); i++) {
    const s = el("span", "bit");
    s.textContent = G[Math.floor(Math.random() * G.length)];
    s.style.color = T[Math.floor(Math.random() * T.length)];
    s.style.left = x + "px"; s.style.top = y + "px";
    document.body.appendChild(s);
    const a = Math.random() * 6.283, d = 70 + Math.random() * 130;
    s.animate([
      { transform: "translate(-50%,-50%) scale(.3) rotate(0deg)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 50}px)) scale(1.4) rotate(${(Math.random() - .5) * 700}deg)`, opacity: 0 }
    ], { duration: 700 + Math.random() * 450, easing: "cubic-bezier(.1,.7,.3,1)" }).onfinish = () => s.remove();
  }
}
function hook(a, url) {
  a.addEventListener("click", (e) => {
    ring(e.clientX, e.clientY); burst(e.clientX, e.clientY, 16); shake(); haptic("heavy");
    if (!inTelegram) return;
    e.preventDefault();
    setTimeout(() => openUrl(url), 430);
  });
}

  const half = unit.repeat(8);

  node.appendChild(track);
}

function tilt(a) {
  a.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    const r = a.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    a.style.transform = `perspective(700px) rotateY(${x * 18}deg) rotateX(${-y * 22}deg) translateY(-4px) scale(1.03)`;
  });
  const reset = () => { a.style.transform = ""; };
  a.addEventListener("pointerleave", reset);
  a.addEventListener("pointercancel", reset);
}

const spot = document.getElementById("spot");
let tx = 0, ty = 0, cx = 0, cy = 0, lastMove = -9999;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
addEventListener("pointermove", (e) => {
  tx = clamp((e.clientX / innerWidth - .5) * 2, -1, 1);
  ty = clamp((e.clientY / innerHeight - .5) * 2, -1, 1);
  lastMove = performance.now();
  spot.style.setProperty("--mx", e.clientX + "px");
  spot.style.setProperty("--my", e.clientY + "px");
}, { passive: true });
addEventListener("deviceorientation", (e) => {
  if (e.gamma == null || e.beta == null) return;
  tx = clamp(e.gamma / 25, -1, 1);
  ty = clamp((e.beta - 55) / 25, -1, 1);
  lastMove = performance.now();
}, { passive: true });

if (!reduce) {
  (function loop(t) {
    if (t - lastMove > 2500) { tx = Math.sin(t / 1300) * .65; ty = Math.cos(t / 1700) * .4; }
    cx += (tx - cx) * .08; cy += (ty - cy) * .08;
    pop.style.setProperty("--px", cx.toFixed(3));
    pop.style.setProperty("--py", cy.toFixed(3));
    requestAnimationFrame(loop);
  })(0);
}

  const g = PROFILE.greeting;

  const s = el("div", "splash");

  s.querySelector(".sp-sub").textContent = (g.subtitle || "").replace("{name}", PROFILE.name);
  document.body.appendChild(s);

})();
